<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Алина · питание и малыш</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7F1;--card:#fff;--ink:#2C2B33;--mute:#7C7886;--line:#EEE7DD;
--sage:#4F8F6E;--sage-d:#3C7558;--sage-l:#E3F1E7;--peach:#F2A58E;--peach-l:#FDEBE4;
--butter:#F2D07A;--butter-l:#FCF3D9;--sky:#A9D3E6;--sky-l:#E4F2F8;--lilac:#C9BDE8;--lilac-l:#EFEAFA;
--red:#D9624F;--red-l:#FCE9E5;--r:18px;--sh:0 6px 24px rgba(80,60,40,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);
background-image:radial-gradient(900px 420px at 95% -10%,#F6E9DD 0,transparent 60%),radial-gradient(700px 380px at -10% 8%,#E6F1E8 0,transparent 55%);background-attachment:fixed;line-height:1.5;font-size:16px}
body.lock{overflow:hidden}
h1,h2,h3{font-family:'Lora',Georgia,serif;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:22px;margin-bottom:10px}h3{font-size:17px;margin-bottom:8px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(251,247,241,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top-in{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--sage),#8CC9A0);display:grid;place-items:center;color:#fff;font-size:18px}
.brand b{font-family:'Lora',serif;font-size:18px;display:block;line-height:1.1}
.brand small{color:var(--mute);font-size:12px}
.ico{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:17px;flex:none}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px;border:1px solid #F3EDE4}
.hero{background:linear-gradient(135deg,var(--sage-l),var(--peach-l));border:0;position:relative;overflow:hidden}
.hero h1{font-size:26px;line-height:1.2}
.hero p{margin:6px 0 0;color:#5b5a63}
.hero .lf{position:absolute;right:-8px;top:-10px;font-size:84px;opacity:.16;transform:rotate(14deg)}
.mute{color:var(--mute)}.sm{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:520px){.g3{grid-template-columns:1fr 1fr 1fr;gap:8px}}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-family:'Lora',serif}.stat span{font-size:12px;color:var(--mute)}
.btn{padding:10px 16px;border-radius:14px;background:var(--sage);color:#fff;font-weight:700;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:active{transform:scale(.98)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--sage-l);color:var(--sage-d)}.btn.danger{background:var(--red-l);color:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}.btn.on{background:var(--sage-l);color:var(--sage-d)}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;margin:0 6px 8px 0}
.chip.on{background:var(--sage-l);border-color:var(--sage);color:var(--sage-d)}
.chip.rare{border-style:dashed}.chip.care{background:var(--butter-l)}
.chip.on.care{background:var(--butter);border-color:#d6b04c;color:#5c4710}
.chips{display:flex;flex-wrap:wrap}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{flex:none;width:56px;padding:8px 0;border-radius:16px;background:#fff;border:1px solid var(--line);text-align:center}
.pill small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.pill b{font-size:18px}
.pill.on{background:var(--sage);border-color:var(--sage);color:#fff}.pill.on small{color:#e6f4ec}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.b-ok{background:var(--sage-l);color:var(--sage-d)}.b-care{background:var(--butter-l);color:#7a5d0f}.b-rare{background:var(--lilac-l);color:#5b4a9b}
.b-no{background:var(--red-l);color:var(--red)}.b-new{background:var(--sky-l);color:#2b6a88}
.slot{border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px;background:#fff}
.slot.done{background:#F4FAF6;border-color:#cfe7d8}
.slot-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.slot-ic{font-size:18px;margin-right:4px}
.rrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.rrow:first-of-type{border-top:0}
.rmain{display:flex;gap:10px;align-items:center;text-align:left;flex:1;min-width:0}
.re{width:42px;height:42px;border-radius:13px;background:var(--butter-l);display:grid;place-items:center;font-size:22px;flex:none}
.rmain b{display:block;line-height:1.25}.rmain small{color:var(--mute);display:block;font-size:12.5px}
.daysum{display:flex;gap:12px;flex-wrap:wrap;font-weight:700;font-size:14px;margin-bottom:10px;color:var(--sage-d)}
.warn{display:inline-block;margin:3px 4px 0 0;padding:1px 8px;border-radius:8px;font-size:11.5px;font-weight:700}
.w-bad{background:var(--red-l);color:var(--red)}.w-care{background:var(--butter-l);color:#7a5d0f}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#eee}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.legend s{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;text-decoration:none}
.grid-r{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:block;width:100%}
.rc .re{margin-bottom:8px}
.rc b{display:block;line-height:1.25;margin-bottom:4px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:#fff;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-l)}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-weight:700;font-size:13px;margin:12px 0 5px;color:#55535e}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.scale button{padding:9px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;line-height:1.2}
.scale button.on{color:#fff;border-color:transparent}
.s0.on{background:var(--sage)}.s1.on{background:#D9B84F}.s2.on{background:#EE9A6F}.s3.on{background:var(--red)}
.alert{border-radius:14px;padding:12px 14px;font-size:14.5px;margin:10px 0}
.a-red{background:var(--red-l);color:#8b2e20}.a-amber{background:var(--butter-l);color:#6d5210}.a-green{background:var(--sage-l);color:#2f6046}.a-blue{background:var(--sky-l);color:#23566f}
.entry{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.empty{padding:22px;text-align:center;color:var(--mute);background:#FBF8F3;border-radius:14px;font-size:14.5px}
details.kb{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.kb summary{list-style:none;padding:14px 16px;font-weight:800;cursor:pointer;display:flex;gap:10px;align-items:center}
details.kb summary::-webkit-details-marker{display:none}
details.kb summary::after{content:'＋';margin-left:auto;color:var(--mute)}
details.kb[open] summary::after{content:'–'}
details.kb .kb-b{padding:0 16px 14px;color:#45434d;font-size:15.5px}
.kb-b ul{padding-left:20px;margin:6px 0}.kb-b li{margin:4px 0}.kb-b p{margin:8px 0}
.prow{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .mk{display:flex;gap:4px;flex:none}
.prow .mk button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px}
.prow .mk button.on.ok{background:var(--sage-l);border-color:var(--sage)}
.prow .mk button.on.bad{background:var(--butter-l);border-color:#d6b04c}
.prow .mk button.on.avoid{background:var(--red-l);border-color:var(--red)}
.gh{font-family:'Lora',serif;font-weight:600;margin:14px 0 2px;font-size:16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(251,247,241,1) 60%,rgba(251,247,241,0))}
.nav-in{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(80,60,40,.12);display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
.nav button{padding:7px 2px;border-radius:16px;font-size:11.5px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button span{font-size:20px;line-height:1.2}
.nav button.on{background:var(--sage-l);color:var(--sage-d)}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(44,43,51,.4)}
.sheet-p{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:700px){.sheet{align-items:center}.sheet-p{border-radius:26px}}
.sheet-x{position:absolute;right:12px;top:12px}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;padding:8px 0 8px 40px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--sage);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
.ing{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;z-index:80;font-size:14px;max-width:90%;text-align:center}
.sticky-total{position:sticky;top:60px}
svg text{font-family:'Nunito',sans-serif}
.foot{font-size:12.5px;color:var(--mute);text-align:center;margin:18px 6px 0}
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.check input{width:20px;height:20px;accent-color:var(--sage)}
.check.done span{text-decoration:line-through;color:var(--mute)}
.tag{background:var(--lilac-l);color:#5b4a9b;border-radius:8px;padding:1px 7px;font-size:11.5px;font-weight:700;margin-right:4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-p"><button class="ico sheet-x" data-act="closeSheet" aria-label="Закрыть">✕</button><div id="sheet-body"></div></div></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<noscript>Для работы приложения нужен JavaScript.</noscript>
<script>
(function(){
'use strict';
/* ============ утилиты ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const dow=s=>(parse(s).getDay()+6)%7;
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WDL=['понедельник','вторник','среду','четверг','пятницу','субботу','воскресенье'];
const WDN=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const fmtDate=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]};
const short=s=>{const d=parse(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const r1=v=>Math.round(v*10)/10;

/* ============ локальная мини-БД (localStorage) ============ */
const KEY='alina_app_v1';
const fresh=()=>({v:1,profile:{mama:'Алина',baby:'',birth:'',birthG:null,onboarded:false},food:[],baby:{},weight:[],water:{},flags:{},over:{},shop:{}});
let D=fresh(),saveT=null;
function load(){
  let raw=null;try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){raw=null}
  const f=fresh();D=Object.assign(f,raw||{});D.profile=Object.assign(fresh().profile,(raw&&raw.profile)||{});
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){toast('⚠ Браузер не даёт сохранить данные. Сделайте резервную копию в настройках.');return false}}
function save(){clearTimeout(saveT);saveT=setTimeout(persist,100)}
window.addEventListener('pagehide',()=>{clearTimeout(saveT);persist()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(saveT);persist()}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

/* ============ продукты ============ */
const G={veg:'Овощи и зелень',fruit:'Фрукты',grain:'Крупы и гарниры',prot:'Белок',fat:'Жиры без масла',other:'Другое'};
const ST={ok:['Можно','b-ok'],care:['Осторожно','b-care'],rare:['Редко','b-rare'],no:['Нельзя','b-no']};
const P={
zucchini:{n:'Кабачок',g:'veg',s:'ok',note:'Основа рациона: тушить, запекать, на пару.'},
cauliflower:{n:'Цветная капуста',g:'veg',s:'ok',note:'Хорошо подходит для крем-супов и пюре.'},
broccoli:{n:'Брокколи',g:'veg',s:'ok',note:'На пару или в супе-пюре.'},

legumes:{n:'Нут, чечевица, горох',g:'prot',s:'care',note:'Бобовые, осторожно (рядом с соей по семейству).'},

function chart({series,yMin,yMax,fmt=v=>v,h=230}){
  const all=series.flatMap(s=>s.pts);
  if(!all.length)return '<div class="empty">Пока нет данных для графика</div>';
  const W=640,H=h,pl=46,pr=14,pt=14,pb=28;
  const X=p=>parse(p[0]).getTime()/864e5;
  const xs=all.map(X);let x0=Math.min(...xs),x1=Math.max(...xs);if(x1-x0<1){x0-=1;x1+=1}
  const ys=all.map(p=>p[1]);let y0=Math.min(...ys),y1=Math.max(...ys);
  if(yMin!=null)y0=yMin;if(yMax!=null)y1=yMax;if(y1===y0){y0-=1;y1+=1}
  if(yMin==null){const pd=(y1-y0)*.12;y0-=pd;y1+=pd}
  if(yMax==null&&yMin!=null){y1+=(y1-y0)*.1}
  const px=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr),py=y=>H-pb-(y-y0)/(y1-y0)*(H-pt-pb);
  let g='';
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=py(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#EEE7DD" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#8a8794">${fmt(v)}</text>`}
  const n=Math.min(5,Math.max(2,Math.floor(x1-x0)+1));
  for(let i=0;i<n;i++){const v=x0+(x1-x0)*i/(n-1);g+=`<text x="${px(v)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#8a8794">${short(ymd(new Date(v*864e5+36e5)))}</text>`}
  series.forEach(s=>{
    const pts=[...s.pts].sort((a,b)=>X(a)-X(b));if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+px(X(p)).toFixed(1)+','+py(p[1]).toFixed(1)).join(' ');
    if(s.area){g+=`<path d="${d} L${px(X(pts[pts.length-1])).toFixed(1)},${H-pb} L${px(X(pts[0])).toFixed(1)},${H-pb} Z" fill="${s.color}" opacity=".12"/>`}
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?2:2.8}" ${s.dash?'stroke-dasharray="6 5"':''} stroke-linecap="round" stroke-linejoin="round"/>`;
    if(s.dots)pts.forEach(p=>{g+=`<circle cx="${px(X(p)).toFixed(1)}" cy="${py(p[1]).toFixed(1)}" r="4" fill="#fff" stroke="${s.color}" stroke-width="2.4"/>`});
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`+
   `<div class="legend">${series.map(s=>`<span><s style="background:${s.color}"></s>${esc(s.name)}</span>`).join('')}</div>`;
}

/* --- рецепт --- */
function fmtQ(i,m){
  if(typeof i.q!=='number')return i.q?(i.q+(i.u?' '+i.u:'')):'';
  let v=i.q*m;
  if(i.u==='шт'||i.u==='зубчик')v=Math.round(v*4)/4;else if(i.u==='г'||i.u==='мл')v=v>=10?Math.round(v/5)*5:Math.round(v*2)/2;else v=Math.round(v*10)/10;
  return String(v).replace('.',',')+' '+i.u;
}

function viewTrends(){
  const ws=weights();
  let h='<h2>Тренды</h2>';
  // вес
  const ser=[{name:'Вес малыша',color:'#4F8F6E',pts:ws.map(x=>[x.date,x.g/1000]),dots:true,area:true}];
  if(D.profile.birth&&D.profile.birthG&&ws.length){
    const f=ws[0].date,l=ws[ws.length-1].date,pts=[];
    for(let d=f;d<=l;d=addDays(d,7)){const e=expectedG(D.profile.birthG,ageDaysAt(d));if(e)pts.push([d,e/1000])}
    const e=expectedG(D.profile.birthG,ageDaysAt(l));if(e)pts.push([l,e/1000]);
    if(pts.length>1)ser.push({name:'Средний ориентир по прибавкам',color:'#C9BDE8',pts,dash:true});
  }
  h+=`<section class="card"><h3>⚖️ Вес</h3>${chart({series:ser,fmt:v=>v.toFixed(1).replace('.',',')})}`;
  if(ws.length>=2){
    const a=ws[ws.length-2],b=ws[ws.length-1],days=diffDays(a.date,b.date),gd=b.g-a.g,per=gd/Math.max(1,days);
    h+=`<div class="grid g3" style="margin-top:12px"><div class="stat"><b>${fmtKg(b.g)}</b><span>последний вес</span></div><div class="stat"><b>${gd>=0?'+':''}${gd} г</b><span>за ${days} дн.</span></div><div class="stat"><b>${Math.round(per)}</b><span>г в сутки</span></div></div>`;
    if(D.profile.birth){const age=ageDaysAt(b.date),m=Math.floor(age/30.4375);
      if(m>=0&&m<12&&days>=5){const exp=GAIN[m]/30.4375;
        const txt=per<exp*.5?['a-amber','Прибавка заметно ниже среднего ориентира для этого возраста (около '+Math.round(exp)+' г/сут). Обсудите с педиатром, особенно если малыш вялый или мало мочит подгузников.']:per>exp*1.8?['a-blue','Прибавка выше среднего ориентира (около '+Math.round(exp)+' г/сут). Это нормально, дети растут по-разному. Опирайтесь на кривую роста у педиатра.']:['a-green','Прибавка в пределах ориентира (около '+Math.round(exp)+' г/сут). Так держать!'];
        h+=`<div class="alert ${txt[0]}">${txt[1]}</div>`}
      else if(days<5)h+='<div class="alert a-blue">Между взвешиваниями меньше 5 дней: оценивать прибавку рано.</div>'}
  }else h+='<div class="alert a-blue">Добавьте хотя бы два взвешивания, и появится динамика. Для ориентира укажите дату рождения и вес при рождении в настройках ⚙️.</div>';
  h+='<div class="mute sm" style="margin-top:6px">Ориентир построен по средним месячным прибавкам из российских педиатрических таблиц. Это не норматив, а подсказка.</div></section>';
  // индекс
  const days=Object.keys(D.baby).sort().slice(-30);
  const pts=days.map(d=>[d,babyScore(d)]);
  const ma=days.map((d,i)=>{const w=days.slice(Math.max(0,i-6),i+1).map(babyScore);return[d,r1(mean(w))]});
  h+=`<section class="card"><h3>👶 Индекс беспокойства малыша</h3>${chart({series:[{name:'За день',color:'#F2A58E',pts,dots:true},{name:'Среднее за 7 дней',color:'#4F8F6E',pts:ma.length>1?ma:[]}],yMin:0,yMax:10,fmt:v=>Math.round(v)})}`;
  if(days.length>=2){const last7=days.slice(-7).map(babyScore),prev7=days.slice(-14,-7).map(babyScore);
    h+=`<div class="grid g3" style="margin-top:12px"><div class="stat"><b>${r1(mean(last7))}</b><span>среднее за 7 дн.</span></div><div class="stat"><b>${prev7.length?r1(mean(prev7)):'—'}</b><span>предыдущие 7 дн.</span></div><div class="stat"><b>${days.filter(d=>babyScore(d)<=2).length}</b><span>спокойных дней</span></div></div>`;
    if(prev7.length){const dl=mean(last7)-mean(prev7);h+=`<div class="alert ${dl<=-0.5?'a-green':dl>=0.5?'a-amber':'a-blue'}">${dl<=-0.5?'Стало спокойнее, чем неделей раньше.':dl>=0.5?'Эта неделя была беспокойнее предыдущей. Посмотрите, что менялось в рационе.':'Состояние малыша держится примерно на одном уровне.'}</div>`}
  }else h+='<div class="alert a-blue">Заполняйте раздел «Малыш» каждый вечер, и здесь появится график.</div>';
  h+='</section>';
  // продукты
  const st=productStats();
  h+=`<section class="card"><h3>🔎 Что может быть связано</h3>`;
  if(st.need)h+=`<div class="alert a-blue">Нужно ещё ${st.need} ${st.need===1?'день':'дн.'} записей о малыше. Чем дольше ведёте дневник, тем точнее подсказки.</div>`;
  else if(!st.rows.length)h+='<div class="alert a-blue">Пока недостаточно данных: каждый продукт нужно записать минимум в 3 разных дня, плюс должны быть дни без него.</div>';
  else{
    h+='<div class="mute sm" style="margin-bottom:8px">Сравнение состояния малыша в день и на следующий день после продукта с остальными днями.</div>';
    st.rows.slice(0,8).forEach(r=>{const bad=r.delta>=1.5,good=r.delta<=-1;
      h+=`<div class="prow"><div><b>${esc(pname(r.p))}</b><div class="mute sm">${r.nEat} дн. · с продуктом ${r1(r.eff)}, без него ${r1(r.base)}</div></div><span class="badge ${bad?'b-no':good?'b-ok':'b-rare'}">${bad?'присмотреться':good?'спокойнее':'нейтрально'} ${r.delta>0?'+':''}${r1(r.delta)}</span></div>`});
  }
  h+='<div class="alert a-amber" style="margin-top:10px">Это подсказки по наблюдениям, а не диагноз: на состояние малыша влияет много факторов. Любые выводы об исключении продуктов — вместе с врачом.</div></section>';
  return h;
}
function productStats(){
  const sd=Object.keys(D.baby).sort();
  if(sd.length<7)return{need:7-sd.length};
  const fb={};D.food.forEach(f=>{(fb[f.date]=fb[f.date]||new Set());entryPids(f).forEach(p=>fb[f.date].add(p))});
  const all=new Set();Object.values(fb).forEach(s=>s.forEach(p=>all.add(p)));
  const out=[];
  all.forEach(p=>{
    const eat=Object.keys(fb).filter(d=>fb[d].has(p));
    const win=new Set();eat.forEach(d=>{win.add(d);win.add(addDays(d,1))});
    const eff=[],base=[];sd.forEach(d=>{(win.has(d)?eff:base).push(babyScore(d))});
    const nEat=eat.filter(d=>D.baby[d]||D.baby[addDays(d,1)]).length;
    if(nEat<3||base.length<3||!eff.length)return;
    out.push({p,nEat,eff:mean(eff),base:mean(base),delta:mean(eff)-mean(base)});
  });
  out.sort((a,b)=>b.delta-a.delta);
  return{rows:out};
}

{i:'🍼',t:'Главное правило при АБКМ',b:`<p>Пока малыш на грудном вскармливании и у него аллергия на белок коровьего молока (АБКМ), из рациона мамы убирают <b>все продукты с белком коровьего молока</b>, включая «следы». Грудное вскармливание при этом сохраняют: диета мамы — часть лечения.</p><ul><li>Козье и овечье молоко не заменяют коровье: белки похожи, возможна перекрёстная реакция.</li><li>Диагностическая безмолочная диета обычно длится несколько недель, дальнейшее решение (расширять рацион или продолжать) принимает врач.</li><li>Основной источник кальция уходит из питания. В российских клинических рекомендациях для таких мам предусмотрен добор кальция (около 1000 мг в сутки). Препарат и дозу подбирает врач.</li><li>В этом приложении дополнительно исключены соя, масла, морковь и тыква, как вы и решили.</li></ul>`},

{i:'🔎',t:'Скрытое молоко, соя и масла в составе',b:`<p><b>Молоко:</b> казеин, казеинат, сыворотка, лактоза, лактальбумин, лактоглобулин, сливки, сухое молоко, пахта, топлёное и сливочное масло, ghee.</p><p><b>Соя:</b> соевая мука, соевый белок, «растительный белок», текстурат, лецитин (E322), тофу, мисо, эдамаме.</p><p><b>Масла:</b> в составе вообще любое «масло», «растительный жир», маргарин, спред, пальмовое.</p><p><b>Где прячется:</b> колбасы, сосиски, полуфабрикаты, хлеб и булочки, хлебцы, печенье, шоколад, соусы, бульонные кубики, каши быстрого приготовления, детское питание.</p><p>Фраза «может содержать следы молока или сои» для вас значит «нельзя». Проверьте состав в разделе «Проверка состава».</p>`},

{i:'📒',t:'Как пользоваться дневником',b:`<ul><li><b>Еда:</b> отмечайте блюда из меню кнопкой «Отметить» на главной или добавляйте записи вручную.</li><li><b>Малыш:</b> один раз вечером, это занимает минуту.</li><li><b>Вес:</b> раз в 1–2 недели на одних и тех же весах.</li><li><b>Тренды:</b> через 7–10 дней записей появятся подсказки, какие продукты стоит наблюдать.</li><li>В настройках ⚙️ можно сохранить резервную копию и перенести данные на другой телефон.</li></ul>`}

const strip=h=>h.replace(/<[^>]+>/g,' ').toLowerCase();
function kbCards(){
  const q=ui.kbq.trim().toLowerCase();
  const l=KB.filter(c=>!q||(c.t+' '+strip(c.b)).toLowerCase().includes(q));
  if(!l.length)return '<div class="empty">Ничего не найдено.</div>';
  return l.map(c=>`<details class="kb" ${q?'open':''}><summary><span style="font-size:22px">${c.i}</span>${c.t}</summary><div class="kb-b">${c.b}</div></details>`).join('');
}
function prodList(){
  const f=ui.pf,q=f.q.trim().toLowerCase();
  let h='';
  Object.keys(G).forEach(g=>{
    const items=Object.keys(P).filter(p=>P[p].g===g&&(f.st==='all'||P[p].s===f.st)&&(!q||(P[p].n+' '+P[p].note).toLowerCase().includes(q)));
    if(!items.length)return;
    h+=`<div class="gh">${G[g]}</div>`;
    items.forEach(p=>{const x=P[p],fl=D.flags[p],s=ST[x.s];
      h+=`<div class="prow"><div style="min-width:0"><b>${esc(x.n)}</b> <span class="badge ${s[1]}">${s[0]}</span><div class="mute sm">${esc(x.note)}</div></div>${x.s!=='no'?`<div class="mk"><button class="ok ${fl==='ok'?'on':''}" data-act="flag" data-p="${p}" data-v="ok" title="Пробовала, всё хорошо">✓</button><button class="bad ${fl==='bad'?'on':''}" data-act="flag" data-p="${p}" data-v="bad" title="Была реакция">⚠</button><button class="avoid ${fl==='avoid'?'on':''}" data-act="flag" data-p="${p}" data-v="avoid" title="Избегаю">✕</button></div>`:''}</div>`});
  });
  return h||'<div class="empty">Ничего не найдено.</div>';
}
function viewKB(){
  let h='<h2>База знаний</h2>'+segHtml([['cards','Памятка'],['prods','Продукты'],['check','Проверка состава']],ui.kb,'kb');
  if(ui.kb==='cards')h+=`<input type="text" data-bind="kbq" placeholder="Поиск по памятке" value="${esc(ui.kbq)}" style="margin-bottom:12px"><div id="kbList">${kbCards()}</div>`;
  if(ui.kb==='prods'){
    h+=`<input type="text" data-bind="pq" placeholder="Найти продукт" value="${esc(ui.pf.q)}" style="margin-bottom:10px"><div class="chips">${[['all','Все'],['ok','Можно'],['care','Осторожно'],['rare','Редко'],['no','Нельзя']].map(([k,l])=>`<button class="chip ${ui.pf.st===k?'on':''}" data-act="pst" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="alert a-blue sm">Ваши отметки: ✓ — пробовала, всё хорошо · ⚠ — была реакция у малыша · ✕ — избегаю. Отметки подсвечивают рецепты и график «Что может быть связано».</div>
    <section class="card" id="prodList">${prodList()}</section>`;
  }
  if(ui.kb==='check')h+=`<section class="card"><h3>Проверка состава</h3><p class="mute sm" style="margin-top:0">Вставьте состав с упаковки. Приложение найдёт молоко, сою, масла, морковь, тыкву и другие стоп-слова, в том числе «следы».</p><textarea id="lbl" placeholder="Например: мука пшеничная, вода, соль, лецитин, может содержать следы молока"></textarea><button class="btn block" style="margin-top:10px" data-act="checkLabel">Проверить</button><div id="lblRes"></div></section>`;
  return h;
}
function checkLabel(txt){
  const t=txt.toLowerCase();
  const rules=[
   ['Молоко',/молок|молоч|сливк|сливоч|сыворот|казеин|лактоз|лактальбумин|лактоглобулин|творог|\bсыр|кефир|йогурт|сметан|пахт|ряженк|простокваш|топлен|гхи|\bghee|whey|casein|lactose|\bmilk|cream|butter|cheese/,'red'],
   ['Соя',/\bсои\b|\bсоя\b|соев|лецитин|[eе]\s?-?322|растительн\S*\s+белок|белок\s+растительн|текстурат|тофу|мисо|эдамаме|\bsoy|lecithin|tofu/,'red'],
   ['Масла и жиры',/масл|\boil\b|растительн\S*\s+жир|жир\s+растительн|маргарин|спред|пальмов/,'red'],
   ['Морковь',/морков|carrot/,'red'],['Тыква',/тыкв|pumpkin/,'red'],
   ['Орехи и арахис',/орех|арахис|миндал|фундук|кешью|фисташ|nut\b|peanut/,'red'],
   ['Яйцо',/яйц|яичн|альбумин|\begg/,'amber'],['Мёд',/\bмёд|\bмед\b|honey/,'amber'],
   ['Ароматизаторы и добавки (состав не раскрыт)',/ароматизатор|пищевые добавки|flavou?r/,'amber'],
   ['Бобовые',/горох|нут\b|чечевиц|фасол|бобов/,'amber']
  ];
  const trace=/след[аыов]|может содержать|may contain|трас/.test(t);
  const hits=rules.filter(r=>r[1].test(t));
  const red=hits.filter(r=>r[2]==='red'),amb=hits.filter(r=>r[2]==='amber');
  let h='';
  if(!t.trim())return '<div class="alert a-amber">Вставьте состав.</div>';
  if(red.length)h+=`<div class="alert a-red"><b>🚫 Не подходит.</b> Найдено: ${red.map(r=>r[0]).join(', ')}.</div>`;
  else if(trace&&/молок|сои|соев|лецитин/.test(t))h+=`<div class="alert a-red"><b>🚫 Не подходит.</b> Есть предупреждение о следах.</div>`;
  else if(amb.length)h+=`<div class="alert a-amber"><b>⚠ С осторожностью.</b> Найдено: ${amb.map(r=>r[0]).join(', ')}.</div>`;
  else h+=`<div class="alert a-green"><b>✓ Явных стоп-слов не нашлось.</b> Всё равно сверьте с упаковкой и убедитесь, что нет надписи о следах.</div>`;
  if(trace&&!red.length)h+=`<div class="alert a-amber">Есть слова про «следы» или «может содержать»: прочитайте, какие именно аллергены указаны.</div>`;
  return h;
}

 export:()=>{persist();const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='alina-backup-'+ymd()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)},
 import:()=>$('#imp').click(),
 reset:()=>{if(confirm('Удалить все записи, вес и настройки без возможности восстановления?')){localStorage.removeItem(KEY);D=fresh();ui.bdDate=null;closeSheet();render();openSettings(true)}}
};
const BIND={
 rq:el=>{ui.rf.q=el.value;$('#recList').innerHTML=recCards()},
 kbq:el=>{ui.kbq=el.value;$('#kbList').innerHTML=kbCards()},
 pq:el=>{ui.pf.q=el.value;$('#prodList').innerHTML=prodList()},
 fslot:el=>{ui.fd.slot=el.value},ftext:el=>{ui.fd.text=el.value},fnew:el=>{ui.fd.isNew=el.checked},
 frec:el=>{if(el.value){ui.fd.rec.push(el.value);render()}},
 bstool:el=>{ui.bd.stool=el.value},btemp:el=>{ui.bd.temp=el.value},bnote:el=>{ui.bd.note=el.value},
 wdate:el=>{ui.wd.date=el.value||ymd()},wval:el=>{ui.wd.v=el.value},
 plateMeal:el=>{ui.plateMeal=el.value},
 shopck:el=>{if(el.checked)D.shop[el.dataset.p]=true;else delete D.shop[el.dataset.p];save();el.closest('.check').classList.toggle('done',el.checked)},
 prof:el=>{const k=el.dataset.k;if(k==='birthG')D.profile.birthG=parseW(el.value);else D.profile[k]=el.value;save()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const h=ACT[el.dataset.act];if(h){e.preventDefault();h(el.dataset,el)}});
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const el=e.target;if(!el.dataset||!el.dataset.bind)return;
  const t=el.type,isText=t==='text'||t==='number'||el.tagName==='TEXTAREA';
  if(ev==='input'&&!isText)return;if(ev==='change'&&isText&&el.dataset.bind!=='prof'&&el.dataset.bind!=='wdate')return;
  const h=BIND[el.dataset.bind];if(h)h(el)}));
$('#imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||typeof o!=='object'||!o.profile||!Array.isArray(o.food))throw 0;
    if(!confirm('Заменить текущие данные данными из файла?'))return;
    D=Object.assign(fresh(),o);D.profile=Object.assign(fresh().profile,o.profile);persist();ui.bdDate=null;closeSheet();render();toast('Данные загружены')}catch(err){toast('Это не файл резервной копии')}};
  rd.readAsText(f);e.target.value='';
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ============ старт ============ */
load();render();
if(!D.profile.onboarded)openSettings(true);
})();
</script>
</body>
</html>
